<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <!-- Perfect circular clip to isolate the 3D chrome emblem -->
        <clipPath id="circle-emblem-clip">
            <circle cx="250" cy="250" r="232" />
        </clipPath>
        
        <!-- Luxury ambient metallic glow and depth drop-shadow -->
        <radialGradient id="chrome-bezel" cx="50%" cy="50%" r="50%">
            <stop offset="92%" stop-color="#ffffff" stop-opacity="0.35"/>
            <stop offset="97%" stop-color="#a0aab8" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#4a525d" stop-opacity="0.9"/>
        </radialGradient>
        
        <filter id="luxury-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.75"/>
        </filter>
    </defs>

    <g filter="url(#luxury-shadow)">
        <!-- Official 3D Auto Studio Emblem Clipped to Exact Circular Bezel -->
        <image href="auto_studio_official_logo.jpg" 
               x="-262" 
               y="-29" 
               width="1024" 
               height="558" 
               clip-path="url(#circle-emblem-clip)" 
               preserveAspectRatio="none" />
               
        <!-- Refined Outer Silver Bezel Ring for Seamless Finish -->
        <circle cx="250" cy="250" r="231" fill="none" stroke="url(#chrome-bezel)" stroke-width="3" />
        <circle cx="250" cy="250" r="233" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.5" />
    </g>
</svg>
