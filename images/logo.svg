<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
    <defs>
        <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b8860b"/>
            <stop offset="25%" stop-color="#ffd700"/>
            <stop offset="50%" stop-color="#ffeb73"/>
            <stop offset="75%" stop-color="#daa520"/>
            <stop offset="100%" stop-color="#8b6508"/>
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="12" fill="url(#gold-gradient)" filter="url(#glow)">AUTO STUDIO</text>
</svg>
